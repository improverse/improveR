url: https://improverse.github.io/improveR/
template:
  bootstrap: 5
  light-switch: true
  bslib:
    bootswatch: flatly
  params:
    toc:
      depth: 4

exclude:
  - "CLAUDE.md"
  - "AGENTS.md"
  - "claude.local.md"
  - "TODO-improveR-updates.md"

toc:
  depth: 4

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github, lightswitch]

  components:
    articles:
      text: Articles
      menu:
        - text: How to...
          href: articles/HowTo.html
        - text: -----------
        - text: Installing improveR
          href: articles/install-improveR.html
        - text: -----------
        - text: Working with Steps
          href: articles/workingWithSteps.html
        - text: Working with Workflows
          href: articles/workingWithWorkflows.html
        - text: Working with improveR in RStudio
          href: articles/rstudioWorkflows.html
        - text: -----------
        - text: CLI Tools
          href: articles/cli-tools.html
        - text: Node Types
          href: articles/basic-node-types.html
        - text: -----------
        - text: Reviews
          href: articles/reviews.html
        - text: Permissions
          href: articles/permissions.html
        - text: Metadata
          href: articles/metadata.html
        - text: Import and Export
          href: articles/importExport.html
        - text: Resource Lifecycle
          href: articles/resourceLifecycle.html
        - text: SSH Tunnels
          href: articles/sshTunnels.html


