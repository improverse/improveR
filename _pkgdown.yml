navbar:
  structure:
    left:  [intro, reference, articles, FAQ, news]
    right: [search, github, lightswitch]

  components:
    faqs:
      text: "FAQs"
      href: articles/faqs.html # This creates a direct link
    articles:
      text: Articles
      menu:
        - text: Installing improveR
